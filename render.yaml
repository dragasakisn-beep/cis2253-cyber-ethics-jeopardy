services:
  - type: web
    name: cis2253-jeopardy-buzzer
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: INSTRUCTOR_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://dragasakisn-beep.github.io
